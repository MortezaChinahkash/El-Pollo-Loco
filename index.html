<html lang="de">  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
      <!-- Preload critical resources -->
    <link rel="preload" href="./css/style.css" as="style">
    <!-- Remove audio preload as it's not efficiently used and causes warnings -->
    
    <!-- Load CSS first for faster rendering -->
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="shortcut icon" href="./img/cactus-157994_1280.png" type="image/x-icon">
      <!-- Load scripts with defer for better performance -->
    <script defer src="./js/performance.config.js"></script>
    <script defer src="./classes.js/drawableObject.class.js"></script>
    <script defer src="./classes.js/movableObject.class.js"></script>
    <script defer src="./classes.js/cloud.classes.js"></script>
    <script defer src="./classes.js/backgroundobjects.class.js"></script>
    <script defer src="./classes.js/chicken.class.js"></script>
    <script defer src="./classes.js/character.class.js"></script>
    <script defer src="./classes.js/endboss.class.js"></script>
    <script defer src="./classes.js/collectableItem.class.js"></script>
    <script defer src="./classes.js/level.class.js"></script>
    <script defer src="./classes.js/soundManager.class.js"></script>
    <script defer src="./classes.js/statusbars.class.js"></script>
    <script defer src="./classes.js/throwableObject.class.js"></script>
    <script defer src="./classes.js/world.class.js"></script>
    <script defer src="./classes.js/keyboard.class.js"></script>
    <script defer src="./js/game.js"></script>
    
    <title>El Pollo Loco</title>
  </head>
  <body>
    <div id="loading-screen">
      <div class="intro-text">
        <div class="start-message">
          <div class="desktop-message">
            <h1>¡Bienvenido a El Pollo Loco!</h1>
            <p>Drücke eine beliebige Taste auf der Tastatur, um das Spiel zu starten</p>
          </div>
          <div class="mobile-message">
            <h1>¡El Pollo Loco!</h1>
            <p>Tippe zum Starten</p>
          </div>
        </div>
      </div>
    </div>
    <div id="helpOverlay">
      <div class="help-content">
        <h2>Steuerung</h2>
        <ul>
          <li>◀️ ▶️ – Bewegen</li>
          <li>⬆️ – Springen</li>
          <li>🍾 (Leertaste) – Flasche werfen</li>
        </ul>
        <button id="closeHelp">Schließen</button>
      </div>
    </div>
   <div id="canvas-container">
  <canvas id="canvas" width="720" height="480" style="display: none"></canvas>
  <div id="overlay-buttons">
    <button id="muteBtn">🔇</button>
    <button id="fullscreenBtn">⛶</button>
    <button id="helpBtn">🎮</button>
  </div>
</div>
    <div class="button-container">
      <button id="restartBtn">Restart</button>
      <button id="nextLevelBtn">Next Level</button>
      <button id="homeBtn">🏠 Home</button>
    </div>

    <div id="mobile-controls">
      <div class="left-controls">
        <button id="btn-jump">⬆️</button>
        <button id="btn-throw">🍾</button>
      </div>
      <div class="right-controls">
        <button id="btn-left">◀️</button>
        <button id="btn-right">▶️</button>
      </div>
    </div>
  </body>
</html>
